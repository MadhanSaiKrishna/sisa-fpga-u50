# v++ --link --config configs/connectivity_sisa.cfg build/gemm_sisa.xo -o build/sisa.xclbin
# One HBM pseudo-channel per slab A port (the host places one copy of A in each), B and C on their own.
# B and C use the same channels as the baseline, so their HBM access pattern is identical.
[connectivity]
nk=gemm_sisa:1:gemm_sisa_1
sp=gemm_sisa_1.A0:HBM[0]
sp=gemm_sisa_1.A1:HBM[1]
sp=gemm_sisa_1.A2:HBM[2]
sp=gemm_sisa_1.A3:HBM[3]
sp=gemm_sisa_1.A4:HBM[4]
sp=gemm_sisa_1.A5:HBM[5]
sp=gemm_sisa_1.A6:HBM[6]
sp=gemm_sisa_1.A7:HBM[7]
sp=gemm_sisa_1.B:HBM[8]
sp=gemm_sisa_1.C:HBM[9]
