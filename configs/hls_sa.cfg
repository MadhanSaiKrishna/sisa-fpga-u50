# Vitis HLS 2025.1 unified-flow config for the conventional SA.
#   v++ -c --mode hls --config configs/hls_sa.cfg --work_dir build/hls_sa
# Written from memory of the 2025.1 key names: DIFF IT against the hls_config.cfg of your course
# mini-project and prefer theirs wherever the key names differ.
part=xcu50-fsvh2104-2-e

[hls]
flow_target=vitis
# HLS scheduling target only (3.333 ns = 300 MHz). Lowering it makes HLS pipeline harder but does NOT
# change the platform kernel clock chosen at link time -- see docs/clocking.md.
clock=3.333
syn.top=gemm_sa
syn.cflags=-I@ROOT@/src
syn.file=@ROOT@/src/gemm_sa.cpp
tb.file=@ROOT@/test/tb.cpp
tb.cflags=-I@ROOT@/src
package.output.format=xo
